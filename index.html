<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太阳系行星环绕动画</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 画布样式：全屏黑色背景 */
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        canvas {
            border: 1px solid #222;
            background: radial-gradient(circle at center, #1a1a2e 0%, #000 70%);
        }
    </style>
</head>
<body>
    <canvas id="solarSystem"></canvas>

    <script>
        // 获取画布和上下文
        const canvas = document.getElementById('solarSystem');
        const ctx = canvas.getContext('2d');

        // 设置画布尺寸
        canvas.width = 1000;
        canvas.height = 800;

        // 太阳系中心坐标（画布中心）
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        // 行星数据配置：名称、轨道半径、大小、颜色、公转速度、当前角度
        const planets = [
            { name: '水星', radius: 80, size: 6, color: '#a6a6a6', speed: 0.04, angle: 0 },
            { name: '金星', radius: 130, size: 8, color: '#ffc649', speed: 0.03, angle: 0 },
            { name: '地球', radius: 180, size: 9, color: '#4287f5', speed: 0.02, angle: 0 },
            { name: '火星', radius: 240, size: 7, color: '#e65c3c', speed: 0.015, angle: 0 }
        ];

        // 绘制太阳
        function drawSun() {
            ctx.beginPath();
            ctx.arc(centerX, centerY, 25, 0, Math.PI * 2);
            // 太阳渐变效果
            const sunGradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 25);
            sunGradient.addColorStop(0, '#fff566');
            sunGradient.addColorStop(0.5, '#ffd000');
            sunGradient.addColorStop(1, '#ff8c00');
            ctx.fillStyle = sunGradient;
            ctx.fill();
            // 太阳光晕
            ctx.shadowColor = '#ffd000';
            ctx.shadowBlur = 40;
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        // 绘制行星轨道
        function drawOrbit(radius) {
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        // 绘制单个行星
        function drawPlanet(planet) {
            // 计算行星坐标（三角函数实现圆周运动）
            const x = centerX + planet.radius * Math.cos(planet.angle);
            const y = centerY + planet.radius * Math.sin(planet.angle);

            ctx.beginPath();
            ctx.arc(x, y, planet.size, 0, Math.PI * 2);
            ctx.fillStyle = planet.color;
            ctx.fill();

            // 更新公转角度
            planet.angle += planet.speed;
        }

        // 动画主循环
        function animate() {
            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制太阳
            drawSun();

            // 遍历绘制所有轨道和行星
            planets.forEach(planet => {
                drawOrbit(planet.radius);
                drawPlanet(planet);
            });

            // 持续渲染动画
            requestAnimationFrame(animate);
        }

        // 启动动画
        animate();
    </script>
</body>
</html>
